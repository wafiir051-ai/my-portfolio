<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Portofolio Waffir</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,600..900&family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --canvas:#081410; --surface:#0f2119; --surface-2:#132a21; --ink:#eef3ef; --soft:#9fb5ab; --faint:#6f8a7f;
  --accent:#3ed8a8; --accent-hover:#5ce6ba; --accent-ink:#04211a; --danger:#ff7a7a; --danger-bg:rgba(255,122,122,.1);
  --line:rgba(238,243,239,.1); --line-2:rgba(238,243,239,.2);
  --display:'Archivo',system-ui,sans-serif; --text:'Geist',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.23,1,.32,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;background:var(--canvas)}
body{min-height:100vh;background:var(--canvas);color:var(--ink);font:400 .97rem/1.55 var(--text);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
::selection{background:var(--accent);color:var(--accent-ink)}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.6rem;padding:0 1.1rem;border:1px solid transparent;border-radius:6px;font-weight:500;font-size:.9rem;cursor:pointer;text-decoration:none;transition:transform .14s var(--ease),background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;cursor:default;pointer-events:none}
.btn--primary{background:var(--accent);color:var(--accent-ink)}
.btn--primary:hover{background:var(--accent-hover)}
.btn--line{border-color:var(--line-2);color:var(--ink);background:transparent}
.btn--line:hover{border-color:var(--ink)}
.btn--danger{border-color:rgba(255,122,122,.45);color:var(--danger);background:transparent}
.btn--danger:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn--sm{min-height:2.1rem;padding:0 .8rem;font-size:.82rem}
.icon-btn{display:grid;place-items:center;width:2.1rem;height:2.1rem;border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer;color:var(--soft);transition:color .14s,border-color .14s,background-color .14s}
.icon-btn:hover:not([disabled]){color:var(--ink);border-color:var(--line-2)}
.icon-btn[disabled]{opacity:.35;cursor:default}

/* formulir */
.field{display:grid;gap:.4rem;margin-bottom:1.1rem}
.field label,.field .label{font-size:.82rem;font-weight:500;color:var(--soft)}
.field .req{color:var(--accent)}
.hint{font-size:.76rem;color:var(--faint)}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=number],input[type=search],textarea{width:100%;min-height:2.7rem;padding:.65rem .85rem;background:var(--canvas);border:1px solid var(--line-2);border-radius:6px;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
textarea{min-height:6.5rem;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(62,216,168,.16)}
input::placeholder,textarea::placeholder{color:var(--faint)}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(60% 50% at 50% 0%,rgba(62,216,168,.09),transparent 70%)}
.login-card{width:100%;max-width:25rem;padding:2rem;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 24px 60px -28px #000}
.brand{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--display);font-weight:900;font-stretch:112%;letter-spacing:.06em;font-size:1.05rem}
.brand i{width:.45em;height:.45em;background:var(--accent);display:inline-block}
.login-card h1{margin:1.5rem 0 .35rem;font:800 1.7rem/1.1 var(--display);font-stretch:105%;letter-spacing:-.03em}
.login-card p{color:var(--soft);font-size:.92rem;margin-bottom:1.5rem}
.form-error{color:var(--danger);font-size:.85rem;margin-top:.85rem;min-height:1.2em}

/* kerangka */
.bar{position:sticky;top:0;z-index:20;background:rgba(8,20,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar__in{max-width:68rem;margin-inline:auto;padding:.75rem clamp(1rem,4vw,2rem);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.bar__brand{margin-right:auto;display:flex;align-items:center;gap:.9rem}
.bar__brand small{color:var(--soft);font-size:.8rem}
.tabs{display:flex;gap:.25rem;padding:.25rem;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tab{min-height:2.2rem;padding:0 .9rem;border:0;border-radius:6px;background:transparent;color:var(--soft);font-weight:500;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;transition:background-color .16s,color .16s}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
.tab .count{font-family:var(--mono);font-size:.7rem;padding:.05rem .4rem;border-radius:99px;background:rgba(238,243,239,.12)}
.tab[aria-selected=true] .count{background:rgba(4,33,26,.18)}
.bar__actions{display:flex;gap:.5rem}
main.wrap{max-width:68rem;margin-inline:auto;padding:clamp(1.25rem,3.5vw,2.25rem) clamp(1rem,4vw,2rem) 5rem}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.head h1{font:800 clamp(1.6rem,1.2rem + 1.6vw,2.2rem)/1.05 var(--display);font-stretch:106%;letter-spacing:-.03em}
.head p{color:var(--soft);font-size:.9rem;margin-top:.35rem;max-width:46ch}
.tools{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.search{position:relative}
.search input{padding-left:2.4rem;min-width:min(16rem,100%)}
.search svg{position:absolute;left:.8rem;top:50%;translate:0 -50%;color:var(--faint);pointer-events:none}

/* daftar */
.list{display:grid;gap:.75rem}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1rem;align-items:center;padding:.9rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;transition:border-color .16s var(--ease)}
.item:hover{border-color:var(--line-2)}
.item--thumb{grid-template-columns:auto auto minmax(0,1fr) auto}
.item__thumb{width:5.5rem;aspect-ratio:1550/1358;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--canvas)}
.item__thumb--empty{display:grid;place-items:center;color:var(--faint)}
.item__order{display:grid;gap:.25rem}
.item__body{min-width:0}
.item__cat{font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.item__title{font:700 1.08rem/1.25 var(--display);font-stretch:104%;letter-spacing:-.015em;margin:.15rem 0 .25rem}
.item__desc{color:var(--soft);font-size:.86rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item__meta{margin-top:.5rem;display:flex;gap:.4rem;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:.35rem;padding:.12rem .55rem;border:1px solid var(--line-2);border-radius:99px;font:500 .72rem var(--mono);color:var(--soft)}
.badge--live{border-color:rgba(62,216,168,.5);color:var(--accent)}
.badge--live::before{content:'';width:.4rem;height:.4rem;border-radius:50%;background:var(--accent)}
.item__actions{display:flex;gap:.4rem}
.empty{padding:3rem 1.25rem;text-align:center;color:var(--soft);border:1px dashed var(--line-2);border-radius:10px}
.empty strong{display:block;color:var(--ink);font:700 1.1rem var(--display);margin-bottom:.3rem}
.skeleton{height:5.2rem;border-radius:10px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.notice{padding:1.1rem 1.2rem;border:1px solid rgba(62,216,168,.4);background:rgba(62,216,168,.07);border-radius:10px;margin-bottom:1rem}
.notice h2{font:700 1.05rem var(--display);margin-bottom:.4rem}
.notice ol{margin:.5rem 0 .9rem 1.2rem;color:var(--soft);font-size:.9rem}
.notice pre{max-height:14rem;overflow:auto;padding:.9rem;background:var(--canvas);border:1px solid var(--line);border-radius:6px;font:400 .76rem/1.5 var(--mono);color:var(--soft);margin-bottom:.8rem;white-space:pre-wrap}

/* dialog */
dialog{margin:auto;width:min(34rem,calc(100vw - 2rem));max-height:calc(100vh - 2rem);padding:0;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px #000;overflow:auto}
dialog::backdrop{background:rgba(3,9,7,.72);backdrop-filter:blur(3px)}
dialog[open]{animation:dlg .22s var(--ease)}
@keyframes dlg{from{opacity:0;transform:translateY(10px) scale(.98)}}
.dlg__head{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.4rem;border-bottom:1px solid var(--line)}
.dlg__head h2{font:800 1.2rem var(--display);font-stretch:105%;letter-spacing:-.02em}
.dlg__body{padding:1.4rem}
.dlg__foot{display:flex;justify-content:flex-end;gap:.6rem;padding:1rem 1.4rem;border-top:1px solid var(--line);background:rgba(0,0,0,.12)}
.dlg__msg{color:var(--soft);font-size:.95rem}
.drop{display:grid;place-items:center;gap:.4rem;padding:1.4rem;border:1px dashed var(--line-2);border-radius:8px;text-align:center;color:var(--soft);cursor:pointer;transition:border-color .16s,background-color .16s}
.drop:hover,.drop.is-over{border-color:var(--accent);background:rgba(62,216,168,.06)}
.drop input{display:none}
.preview{display:grid;gap:.6rem}
.preview img{width:100%;max-height:15rem;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:var(--canvas)}
.preview__actions{display:flex;gap:.5rem;flex-wrap:wrap}

/* notifikasi */
#toasts{position:fixed;right:1rem;bottom:1rem;z-index:200;display:grid;gap:.5rem;width:min(22rem,calc(100vw - 2rem))}
.toast{padding:.8rem 1rem;border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:8px;background:var(--surface-2);box-shadow:0 14px 40px -14px #000;font-size:.9rem;animation:toast .25s var(--ease)}
.toast--error{border-left-color:var(--danger)}
@keyframes toast{from{opacity:0;transform:translateY(8px)}}
@media (max-width:640px){
  .item,.item--thumb{grid-template-columns:auto minmax(0,1fr)}
  .item__actions{grid-column:1/-1;flex-direction:row!important}
  .item__order{display:none}
  .item__thumb{width:4.5rem}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<main id="login" hidden>
  <div class="login-card">
    <span class="brand"><span>WHA</span><i></i></span>
    <h1>Masuk admin</h1>
    <p>Kelola proyek dan prestasi yang tampil di portofolio.</p>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">Email</label><input type="email" id="email" required autocomplete="username"></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn--primary" style="width:100%">Masuk</button>
      <p class="form-error" id="loginError" role="alert"></p>
    </form>
  </div>
</main>

<div id="app" hidden>
  <header class="bar">
    <div class="bar__in">
      <div class="bar__brand"><span class="brand"><span>WHA</span><i></i></span><small>Admin portofolio</small></div>
      <div class="tabs" role="tablist" aria-label="Bagian admin">
        <button class="tab" role="tab" id="tab-projects" aria-controls="panel-projects" aria-selected="true">Proyek <span class="count" id="count-projects">0</span></button>
        <button class="tab" role="tab" id="tab-achievements" aria-controls="panel-achievements" aria-selected="false">Prestasi <span class="count" id="count-achievements">0</span></button>
      </div>
      <div class="bar__actions">
        <a class="btn btn--line btn--sm" href="/" target="_blank" rel="noopener">Lihat situs</a>
        <button class="btn btn--line btn--sm" id="logoutBtn" type="button">Keluar</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="panel-projects" role="tabpanel" aria-labelledby="tab-projects">
      <div class="head">
        <div><h1>Proyek</h1><p>Yang tampil di rak proyek. Urutannya mengikuti daftar di bawah.</p></div>
        <div class="tools">
          <label class="search"><span class="sr" hidden>Cari proyek</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" id="search" placeholder="Cari proyek" aria-label="Cari proyek"></label>
          <button class="btn btn--primary" id="addProject" type="button">+ Tambah proyek</button>
        </div>
      </div>
      <div class="list" id="projectList"></div>
    </section>

    <section id="panel-achievements" role="tabpanel" aria-labelledby="tab-achievements" hidden>
      <div class="head">
        <div><h1>Prestasi</h1><p>Tampil di bagian Tentang, lengkap dengan gambar bukti yang bisa diperbesar.</p></div>
        <div class="tools"><button class="btn btn--primary" id="addAchievement" type="button">+ Tambah prestasi</button></div>
      </div>
      <div id="achievementSetup" hidden></div>
      <div class="list" id="achievementList"></div>
    </section>
  </main>
</div>

<dialog id="formDialog" aria-labelledby="formTitle">
  <form id="dialogForm" novalidate>
    <div class="dlg__head"><h2 id="formTitle"></h2><button type="button" class="icon-btn" id="formClose" aria-label="Tutup">&times;</button></div>
    <div class="dlg__body" id="formBody"></div>
    <div class="dlg__foot">
      <p class="form-error" id="formError" role="alert" style="margin:0 auto 0 0;align-self:center"></p>
      <button type="button" class="btn btn--line" id="formCancel">Batal</button>
      <button type="submit" class="btn btn--primary" id="formSave">Simpan</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDialog" aria-labelledby="confirmTitle">
  <div class="dlg__head"><h2 id="confirmTitle">Hapus?</h2></div>
  <div class="dlg__body"><p class="dlg__msg" id="confirmMsg"></p></div>
  <div class="dlg__foot">
    <button type="button" class="btn btn--line" id="confirmNo">Batal</button>
    <button type="button" class="btn btn--danger" id="confirmYes">Hapus</button>
  </div>
</dialog>

<div id="toasts" aria-live="polite"></div>

<script>
(function () {
  var SUPABASE_URL = "https://erfuemuloqptttrbccmw.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyZnVlbXVsb3FwdHR0cmJjY213Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MDk4OTgsImV4cCI6MjEwMTM4NTg5OH0.NRk5Ve1I6s71Zw1RAd10IFrXlI7ivySC3LDeQRb68ko";
  var SETUP_SQL = "-- Tabel prestasi untuk portofolio + bucket gambar, dikelola lewat /admin.\n-- Jalankan sekali di Supabase: SQL Editor > New query > paste > Run.\n--\n-- PENTING (keamanan): policy tulis di bawah memakai peran \"authenticated\", yaitu\n-- siapa pun yang punya akun di project ini. Matikan pendaftaran publik di\n-- Authentication > Sign In / Providers > \"Allow new users to sign up\", supaya\n-- hanya akunmu yang bisa login ke /admin.\n\ncreate table if not exists public.achievements (\n  id uuid primary key default gen_random_uuid(),\n  title text not null,\n  note text,\n  year integer,\n  image_url text,\n  sort_order integer not null default 999,\n  created_at timestamptz not null default now()\n);\n\nalter table public.achievements enable row level security;\n\ndrop policy if exists \"achievements read\" on public.achievements;\ncreate policy \"achievements read\" on public.achievements\n  for select to anon, authenticated using (true);\n\ndrop policy if exists \"achievements insert\" on public.achievements;\ncreate policy \"achievements insert\" on public.achievements\n  for insert to authenticated with check (true);\n\ndrop policy if exists \"achievements update\" on public.achievements;\ncreate policy \"achievements update\" on public.achievements\n  for update to authenticated using (true) with check (true);\n\ndrop policy if exists \"achievements delete\" on public.achievements;\ncreate policy \"achievements delete\" on public.achievements\n  for delete to authenticated using (true);\n\n-- Bucket gambar prestasi (publik dibaca, hanya admin yang menulis).\ninsert into storage.buckets (id, name, public)\nvalues ('achievements', 'achievements', true)\non conflict (id) do update set public = true;\n\ndrop policy if exists \"achievements files read\" on storage.objects;\ncreate policy \"achievements files read\" on storage.objects\n  for select to anon, authenticated using (bucket_id = 'achievements');\n\ndrop policy if exists \"achievements files insert\" on storage.objects;\ncreate policy \"achievements files insert\" on storage.objects\n  for insert to authenticated with check (bucket_id = 'achievements');\n\ndrop policy if exists \"achievements files update\" on storage.objects;\ncreate policy \"achievements files update\" on storage.objects\n  for update to authenticated using (bucket_id = 'achievements') with check (bucket_id = 'achievements');\n\ndrop policy if exists \"achievements files delete\" on storage.objects;\ncreate policy \"achievements files delete\" on storage.objects\n  for delete to authenticated using (bucket_id = 'achievements');\n\n-- Isi awal: prestasi hadroh dan LKS (gambarnya sudah ada di situs).\ninsert into public.achievements (title, note, year, image_url, sort_order)\nselect v.title, v.note, v.year, v.image_url, v.sort_order\nfrom (values\n  ('Terbaik 1 Festival Hadroh BAF (Buahati Annual Fest) tingkat Jabodetabek',\n   'Saat kelas 9, bersama Tim Hadroh SMPIT Insan Mandiri Greenville',\n   2025, '/prestasi/hadroh-baf-2025.webp', 1),\n  ('Peserta LKS Tingkat Provinsi Jawa Barat 2026, bidang Robot Bergerak Otonom',\n   'Mewakili Kab. Subang, 10 sampai 11 Juni 2026 di SMK Negeri 1 Karawang',\n   2026, '/prestasi/lks-jabar-2026.jpg', 2)\n) as v(title, note, year, image_url, sort_order)\nwhere not exists (select 1 from public.achievements);\n";
  var BUCKET = 'achievements';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var state = { tab: 'projects', projects: [], achievements: [], q: '', achievementsMissing: false };

  function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') || (u || '').charAt(0) === '/' ? u : ''; }

  /* ---------- notifikasi dan konfirmasi ---------- */
  function toast(msg, type) {
    var t = document.createElement('div');
    t.className = 'toast' + (type === 'error' ? ' toast--error' : '');
    t.textContent = msg;
    $('#toasts').appendChild(t);
    setTimeout(function () { t.remove(); }, type === 'error' ? 6000 : 3200);
  }
  function confirmDialog(title, message, yes) {
    return new Promise(function (resolve) {
      var d = $('#confirmDialog');
      $('#confirmTitle').textContent = title;
      $('#confirmMsg').textContent = message;
      $('#confirmYes').textContent = yes || 'Hapus';
      var done = function (v) { d.close(); cleanup(); resolve(v); };
      var onYes = function () { done(true); };
      var onNo = function () { done(false); };
      var onCancel = function (e) { e.preventDefault(); done(false); };
      function cleanup() { $('#confirmYes').removeEventListener('click', onYes); $('#confirmNo').removeEventListener('click', onNo); d.removeEventListener('cancel', onCancel); }
      $('#confirmYes').addEventListener('click', onYes); $('#confirmNo').addEventListener('click', onNo); d.addEventListener('cancel', onCancel);
      d.showModal();
    });
  }

  /* ---------- sesi ---------- */
  function showApp() { $('#login').hidden = true; $('#app').hidden = false; loadAll(); }
  function showLogin() { $('#app').hidden = true; $('#login').hidden = false; }
  sb.auth.getSession().then(function (r) { if (r.data.session) showApp(); else showLogin(); }, function () { showLogin(); });

  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var err = $('#loginError'); err.textContent = '';
    var btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    sb.auth.signInWithPassword({ email: $('#email').value, password: $('#password').value }).then(function (r) {
      btn.disabled = false;
      if (r.error) { err.textContent = 'Email atau password salah.'; return; }
      showApp();
    }, function () { btn.disabled = false; err.textContent = 'Tidak bisa terhubung ke server. Coba lagi.'; });
  });
  $('#logoutBtn').addEventListener('click', function () { sb.auth.signOut().then(showLogin); });

  /* ---------- tab ---------- */
  function setTab(name) {
    state.tab = name;
    ['projects', 'achievements'].forEach(function (n) {
      $('#tab-' + n).setAttribute('aria-selected', String(n === name));
      $('#panel-' + n).hidden = n !== name;
    });
  }
  $('#tab-projects').addEventListener('click', function () { setTab('projects'); });
  $('#tab-achievements').addEventListener('click', function () { setTab('achievements'); });
  $('#search').addEventListener('input', function (e) { state.q = e.target.value.toLowerCase(); renderProjects(); });

  /* ---------- data ---------- */
  function loadAll() { loadProjects(); loadAchievements(); }
  function skeleton(el) { el.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>'; }

  function loadProjects() {
    skeleton($('#projectList'));
    sb.from('projects').select('*').order('sort_order', { ascending: true }).then(function (r) {
      if (r.error) { $('#projectList').innerHTML = '<div class="empty"><strong>Gagal memuat proyek</strong>' + esc(r.error.message) + '</div>'; return; }
      state.projects = r.data; $('#count-projects').textContent = r.data.length; renderProjects();
    });
  }
  function loadAchievements() {
    skeleton($('#achievementList'));
    sb.from('achievements').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: true }).then(function (r) {
      var setup = $('#achievementSetup');
      if (r.error) {
        var missing = r.error.code === 'PGRST205' || r.error.code === '42P01' || /achievements/.test(r.error.message || '') && /(schema cache|does not exist)/.test(r.error.message || '');
        state.achievementsMissing = missing;
        $('#achievementList').innerHTML = '';
        if (missing) {
          setup.hidden = false;
          setup.innerHTML = '<div class="notice"><h2>Tabel prestasi belum dibuat</h2><ol><li>Buka Supabase, menu <b>SQL Editor</b>, lalu <b>New query</b>.</li><li>Salin SQL di bawah, tempel, lalu tekan <b>Run</b>.</li><li>Muat ulang halaman ini.</li></ol><pre id="sqlBox"></pre><button class="btn btn--primary btn--sm" id="copySql" type="button">Salin SQL</button></div>';
          $('#sqlBox').textContent = SETUP_SQL;
          $('#copySql').addEventListener('click', function () { navigator.clipboard.writeText(SETUP_SQL).then(function () { toast('SQL disalin.'); }, function () { toast('Tidak bisa menyalin. Blok teksnya lalu salin manual.', 'error'); }); });
        } else {
          $('#achievementList').innerHTML = '<div class="empty"><strong>Gagal memuat prestasi</strong>' + esc(r.error.message) + '</div>';
        }
        return;
      }
      setup.hidden = true; state.achievementsMissing = false;
      state.achievements = r.data; $('#count-achievements').textContent = r.data.length; renderAchievements();
    });
  }

  /* ---------- tampilan daftar ---------- */
  var ICON = {
    up: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
    down: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    img: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>'
  };

  function renderProjects() {
    var list = $('#projectList');
    var rows = state.projects.filter(function (p) {
      return !state.q || [p.title, p.category, p.description].join(' ').toLowerCase().indexOf(state.q) !== -1;
    });
    if (!state.projects.length) { list.innerHTML = '<div class="empty"><strong>Belum ada proyek</strong>Tekan "Tambah proyek" untuk mulai. Selama kosong, situs memakai daftar bawaan.</div>'; return; }
    if (!rows.length) { list.innerHTML = '<div class="empty"><strong>Tidak ada hasil</strong>Coba kata kunci lain.</div>'; return; }
    list.innerHTML = '';
    rows.forEach(function (p) {
      var idx = state.projects.indexOf(p);
      var live = !!safeUrl(p.link_url);
      var el = document.createElement('article'); el.className = 'item';
      el.innerHTML =
        '<div class="item__order"></div>' +
        '<div class="item__body"><div class="item__cat">' + esc(p.category || 'Tanpa kategori') + '</div>' +
        '<h3 class="item__title">' + esc(p.title) + '</h3><p class="item__desc">' + esc(p.description) + '</p>' +
        '<div class="item__meta">' + (live ? '<span class="badge badge--live">Live</span>' : '<span class="badge">' + esc(p.status_text || 'Belum live') + '</span>') +
        (p.tags || []).slice(0, 4).map(function (t) { return '<span class="badge">' + esc(t) + '</span>'; }).join('') + '</div></div>' +
        '<div class="item__actions"></div>';
      var order = el.querySelector('.item__order');
      order.appendChild(orderBtn('up', 'Naikkan', idx === 0 || !!state.q, function () { move('projects', state.projects, idx, -1); }));
      order.appendChild(orderBtn('down', 'Turunkan', idx === state.projects.length - 1 || !!state.q, function () { move('projects', state.projects, idx, 1); }));
      var act = el.querySelector('.item__actions');
      act.appendChild(textBtn('Edit', 'btn btn--line btn--sm', function () { openProjectForm(p); }));
      act.appendChild(textBtn('Hapus', 'btn btn--danger btn--sm', function () { removeProject(p); }));
      list.appendChild(el);
    });
  }

  function renderAchievements() {
    var list = $('#achievementList');
    if (!state.achievements.length) { list.innerHTML = '<div class="empty"><strong>Belum ada prestasi</strong>Tekan "Tambah prestasi". Selama kosong, situs memakai prestasi bawaan.</div>'; return; }
    list.innerHTML = '';
    state.achievements.forEach(function (a, idx) {
      var el = document.createElement('article'); el.className = 'item';
      var img = safeUrl(a.image_url);
      el.innerHTML =
        '<div class="item__order"></div>' +
        '<div class="item__body"><div class="item__cat">Prestasi' + (a.year ? ' ' + esc(a.year) : '') + '</div>' +
        '<h3 class="item__title">' + esc(a.title) + '</h3><p class="item__desc">' + esc(a.note || '') + '</p>' +
        '<div class="item__meta">' + (img ? '<span class="badge badge--live">Ada gambar</span>' : '<span class="badge">Tanpa gambar</span>') + '</div></div>' +
        '<div class="item__actions"></div>';
      var thumb;
      if (img) { thumb = document.createElement('img'); thumb.className = 'item__thumb'; thumb.src = img; thumb.alt = ''; }
      else { thumb = document.createElement('div'); thumb.className = 'item__thumb item__thumb--empty'; thumb.innerHTML = ICON.img; }
      el.insertBefore(thumb, el.children[1]);
      el.classList.add('item--thumb');
      var order = el.querySelector('.item__order');
      order.appendChild(orderBtn('up', 'Naikkan', idx === 0, function () { move('achievements', state.achievements, idx, -1); }));
      order.appendChild(orderBtn('down', 'Turunkan', idx === state.achievements.length - 1, function () { move('achievements', state.achievements, idx, 1); }));
      var act = el.querySelector('.item__actions');
      act.appendChild(textBtn('Edit', 'btn btn--line btn--sm', function () { openAchievementForm(a); }));
      act.appendChild(textBtn('Hapus', 'btn btn--danger btn--sm', function () { removeAchievement(a); }));
      list.appendChild(el);
    });
  }

  function orderBtn(dir, label, disabled, fn) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'icon-btn'; b.setAttribute('aria-label', label); b.innerHTML = ICON[dir]; b.disabled = disabled; b.addEventListener('click', fn); return b;
  }
  function textBtn(text, cls, fn) { var b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = text; b.addEventListener('click', fn); return b; }

  function move(table, arr, idx, dir) {
    var j = idx + dir; if (j < 0 || j >= arr.length) return;
    var next = arr.slice(); var t = next[idx]; next[idx] = next[j]; next[j] = t;
    Promise.all(next.map(function (it, i) { return sb.from(table).update({ sort_order: i + 1 }).eq('id', it.id); })).then(function (rs) {
      var bad = rs.filter(function (r) { return r.error; })[0];
      if (bad) { toast('Gagal mengubah urutan: ' + bad.error.message, 'error'); }
      else toast('Urutan disimpan.');
      table === 'projects' ? loadProjects() : loadAchievements();
    });
  }

  /* ---------- dialog formulir ---------- */
  var dlg = $('#formDialog');
  var currentSave = null;
  function openForm(title, bodyHtml, onSave) {
    $('#formTitle').textContent = title; $('#formBody').innerHTML = bodyHtml; $('#formError').textContent = ''; currentSave = onSave;
    $('#formSave').disabled = false; $('#formSave').textContent = 'Simpan';
    dlg.showModal();
    var first = $('#formBody input, #formBody textarea'); if (first) first.focus();
  }
  function closeForm() { dlg.close(); currentSave = null; }
  $('#formClose').addEventListener('click', closeForm);
  $('#formCancel').addEventListener('click', closeForm);
  dlg.addEventListener('click', function (e) { if (e.target === dlg) closeForm(); });
  $('#dialogForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!currentSave) return;
    var btn = $('#formSave'); btn.disabled = true; btn.textContent = 'Menyimpan...'; $('#formError').textContent = '';
    Promise.resolve(currentSave()).then(function () { closeForm(); }, function (err) {
      $('#formError').textContent = err && err.message ? err.message : 'Gagal menyimpan.'; btn.disabled = false; btn.textContent = 'Simpan';
    });
  });

  function field(id, label, opts) {
    opts = opts || {};
    var req = opts.req ? ' <span class="req">*</span>' : '';
    var control = opts.area
      ? '<textarea id="' + id + '" ' + (opts.req ? 'required' : '') + ' placeholder="' + esc(opts.ph || '') + '">' + esc(opts.val || '') + '</textarea>'
      : '<input type="' + (opts.type || 'text') + '" id="' + id + '" ' + (opts.req ? 'required' : '') + ' value="' + esc(opts.val || '') + '" placeholder="' + esc(opts.ph || '') + '"' + (opts.attrs || '') + '>';
    return '<div class="field"><label for="' + id + '">' + label + req + '</label>' + control + (opts.hint ? '<span class="hint">' + opts.hint + '</span>' : '') + '</div>';
  }
  function need(v, msg) { if (!String(v || '').trim()) throw new Error(msg); }

  /* ---------- proyek ---------- */
  function projectBody(p) {
    p = p || {};
    return field('f_title', 'Judul proyek', { req: true, val: p.title, ph: 'Contoh: Puspita Indah' }) +
      field('f_category', 'Kategori', { val: p.category, ph: 'Contoh: Website Bisnis' }) +
      field('f_description', 'Deskripsi', { req: true, area: true, val: p.description, ph: 'Ceritakan singkat tentang proyek ini' }) +
      field('f_tags', 'Tag', { val: (p.tags || []).join(', '), ph: 'React, Supabase, Vercel', hint: 'Pisahkan dengan koma.' }) +
      field('f_link', 'Link live', { type: 'url', val: p.link_url, ph: 'https://...', hint: 'Kosongkan kalau belum live.' }) +
      field('f_status', 'Teks status', { val: p.status_text, ph: 'Contoh: Dalam pengembangan', hint: 'Dipakai kalau belum ada link live.' });
  }
  function readProject() {
    var title = $('#f_title').value, desc = $('#f_description').value, link = $('#f_link').value.trim();
    need(title, 'Judul wajib diisi.'); need(desc, 'Deskripsi wajib diisi.');
    if (link && !/^https?:\/\//i.test(link)) throw new Error('Link harus diawali http:// atau https://');
    return {
      title: title.trim(), category: $('#f_category').value.trim(), description: desc.trim(),
      tags: $('#f_tags').value.split(',').map(function (t) { return t.trim(); }).filter(Boolean),
      link_url: link || null, status_text: $('#f_status').value.trim() || null
    };
  }
  function openProjectForm(p) {
    openForm(p ? 'Edit proyek' : 'Tambah proyek', projectBody(p), function () {
      var payload = readProject();
      var q = p ? sb.from('projects').update(payload).eq('id', p.id) : sb.from('projects').insert(Object.assign({ sort_order: state.projects.length + 1 }, payload));
      return q.then(function (r) { if (r.error) throw r.error; toast(p ? 'Proyek diperbarui.' : 'Proyek ditambahkan.'); loadProjects(); });
    });
  }
  function removeProject(p) {
    confirmDialog('Hapus proyek?', '"' + p.title + '" akan dihapus dari portofolio dan tidak bisa dikembalikan.').then(function (ok) {
      if (!ok) return;
      sb.from('projects').delete().eq('id', p.id).then(function (r) {
        if (r.error) { toast('Gagal menghapus: ' + r.error.message, 'error'); return; }
        toast('Proyek dihapus.'); loadProjects();
      });
    });
  }
  $('#addProject').addEventListener('click', function () { openProjectForm(null); });

  /* ---------- prestasi + gambar ---------- */
  var img = { file: null, remove: false, current: '' };

  function publicPath(url) { var m = String(url || '').match(/\/storage\/v1\/object\/public\/achievements\/(.+)$/); return m ? decodeURIComponent(m[1]) : null; }
  function deleteFileFor(url) { var path = publicPath(url); return path ? sb.storage.from(BUCKET).remove([path]) : Promise.resolve(); }

  function resizeToWebp(file, maxSide) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file); var im = new Image();
      im.onload = function () {
        var s = Math.min(1, maxSide / Math.max(im.width, im.height));
        var c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('Gagal memproses gambar.')); }, 'image/webp', 0.86);
      };
      im.onerror = function () { URL.revokeObjectURL(url); reject(new Error('File bukan gambar yang valid.')); };
      im.src = url;
    });
  }

  function achievementBody(a) {
    a = a || {};
    return field('f_title', 'Nama prestasi', { req: true, val: a.title, ph: 'Contoh: Juara 1 Lomba ...' }) +
      field('f_year', 'Tahun', { type: 'number', val: a.year, ph: '2025', attrs: ' min="1990" max="2100"' }) +
      field('f_note', 'Keterangan', { area: true, val: a.note, ph: 'Contoh: Saat kelas 9, bersama tim ...' }) +
      '<div class="field"><span class="label">Gambar bukti</span><div class="preview" id="imgBox"></div>' +
      '<span class="hint">JPG, PNG, atau WebP. Otomatis dikecilkan agar situs tetap cepat.</span></div>' +
      field('f_imgurl', 'Atau tempel alamat gambar', { type: 'url', val: '', ph: 'https://...' });
  }
  function drawImgBox() {
    var box = $('#imgBox'); var src = img.file ? URL.createObjectURL(img.file) : (img.remove ? '' : safeUrl(img.current));
    box.innerHTML = '';
    if (src) {
      var im = document.createElement('img'); im.src = src; im.alt = 'Pratinjau gambar'; box.appendChild(im);
      var act = document.createElement('div'); act.className = 'preview__actions';
      var rep = textBtn('Ganti gambar', 'btn btn--line btn--sm', function () { fileInput.click(); });
      var del = textBtn('Hapus gambar', 'btn btn--danger btn--sm', function () { img.file = null; img.remove = true; drawImgBox(); });
      act.appendChild(rep); act.appendChild(del); box.appendChild(act); box.appendChild(fileInput);
    } else {
      var d = document.createElement('label'); d.className = 'drop'; d.innerHTML = ICON.img + '<span><b>Pilih gambar</b> atau seret ke sini</span>';
      d.appendChild(fileInput);
      ['dragenter', 'dragover'].forEach(function (ev) { d.addEventListener(ev, function (e) { e.preventDefault(); d.classList.add('is-over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { d.addEventListener(ev, function (e) { e.preventDefault(); d.classList.remove('is-over'); }); });
      d.addEventListener('drop', function (e) { var f = e.dataTransfer.files[0]; if (f) pickFile(f); });
      box.appendChild(d);
    }
  }
  var fileInput = document.createElement('input'); fileInput.type = 'file'; fileInput.hidden = true; fileInput.accept = 'image/jpeg,image/png,image/webp';
  fileInput.addEventListener('change', function () { if (fileInput.files[0]) pickFile(fileInput.files[0]); fileInput.value = ''; });
  function pickFile(f) {
    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { $('#formError').textContent = 'Pilih file JPG, PNG, atau WebP.'; return; }
    if (f.size > 10 * 1024 * 1024) { $('#formError').textContent = 'Ukuran file maksimal 10 MB.'; return; }
    $('#formError').textContent = ''; img.file = f; img.remove = false; drawImgBox();
  }

  function openAchievementForm(a) {
    img = { file: null, remove: false, current: a ? (a.image_url || '') : '' };
    openForm(a ? 'Edit prestasi' : 'Tambah prestasi', achievementBody(a), function () {
      var title = $('#f_title').value; need(title, 'Nama prestasi wajib diisi.');
      var year = $('#f_year').value ? parseInt($('#f_year').value, 10) : null;
      var urlInput = $('#f_imgurl').value.trim();
      if (urlInput && !/^https?:\/\//i.test(urlInput)) throw new Error('Alamat gambar harus diawali http:// atau https://');
      var finalUrl = img.remove ? '' : img.current;
      var step = Promise.resolve();
      if (img.file) {
        step = resizeToWebp(img.file, 1600).then(function (blob) {
          var path = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())) + '.webp';
          return sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/webp', upsert: false }).then(function (r) {
            if (r.error) throw new Error('Gagal mengunggah gambar: ' + r.error.message);
            finalUrl = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
          });
        });
      } else if (urlInput) { finalUrl = urlInput; }
      return step.then(function () {
        var payload = { title: title.trim(), year: year, note: $('#f_note').value.trim() || null, image_url: finalUrl || null };
        var q = a ? sb.from('achievements').update(payload).eq('id', a.id) : sb.from('achievements').insert(Object.assign({ sort_order: state.achievements.length + 1 }, payload));
        return q.then(function (r) {
          if (r.error) throw r.error;
          var old = a ? a.image_url : '';
          if (old && old !== finalUrl) deleteFileFor(old);
          toast(a ? 'Prestasi diperbarui.' : 'Prestasi ditambahkan.'); loadAchievements();
        });
      });
    });
    drawImgBox();
  }
  function removeAchievement(a) {
    confirmDialog('Hapus prestasi?', '"' + a.title + '" dan gambarnya akan dihapus dari portofolio.').then(function (ok) {
      if (!ok) return;
      sb.from('achievements').delete().eq('id', a.id).then(function (r) {
        if (r.error) { toast('Gagal menghapus: ' + r.error.message, 'error'); return; }
        deleteFileFor(a.image_url); toast('Prestasi dihapus.'); loadAchievements();
      });
    });
  }
  $('#addAchievement').addEventListener('click', function () { openAchievementForm(null); });
})();
</script>
</body>
</html>
